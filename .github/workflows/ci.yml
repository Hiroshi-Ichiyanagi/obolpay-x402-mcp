name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m compileall -q .
      - run: pip install -r requirements.txt pytest
      - run: pytest -q   # import破壊(例: mcp 2.0のFastMCP削除)を含むスモーク
